server:
  persistentVolume:
    enabled: false
  retention: 6h
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi
  extraScrapeConfigs:
  - job_name: flask-app
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
    - targets:
      - flask-service.flask-cicd.svc.cluster.local:80
alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
prometheus-node-exporter:
  enabled: false
kube-state-metrics:
  enabled: false
